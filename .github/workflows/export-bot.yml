name: Export bot ZIP

on:
  push:
    branches:
      - "tmp/export-bot-20260927"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create bot ZIP
        run: |
          zip -r discord-bot-project.zip bot.py storage.py requirements.txt FEATURES.md cogs
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: discord-bot-project
          path: discord-bot-project.zip
          if-no-files-found: error
