name: Bot structural smoke test

on:
  push:
    branches:
      - "tmp/export-bot-20260927"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Import and register commands without Discord network
        env:
          DISCORD_TOKEN: "dummy"
        run: |
          python - <<'PY'
          import asyncio
          import discord
          from discord.ext import commands

          discord.Client.run = lambda self, *args, **kwargs: None

          import bot as bot_module

          async def fake_sync(*args, **kwargs):
              return []

          bot_module.bot.tree.sync = fake_sync

          async def main():
              await bot_module.bot.setup_hook()
              names = [c.qualified_name for c in bot_module.bot.tree.walk_commands()]
              assert names, "No slash commands registered"
              assert len(names) == len(set(names)), "Duplicate slash command names detected"
              required = {"help", "music play", "game rps", "autoreply add", "rolepanel create", "poll create", "giveaway create", "security mention-limit"}
              missing = sorted(required - set(names))
              assert not missing, f"Missing expected commands: {missing}"
              print(f"REGISTERED_COMMANDS={len(names)}")
              print("COMMAND_TREE_SMOKE_TEST_OK")

          asyncio.run(main())
          PY
