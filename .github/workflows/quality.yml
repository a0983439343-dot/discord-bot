name: Website quality checks
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check command catalog syntax
        run: node --check commands.js
      - name: Check config syntax
        run: node --check site-config.js
      - name: Verify website assets
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css styles-a.css styles-b.css styles-c.css app.js commands.js site-config.js favicon.svg 404.html robots.txt sitemap.xml; do
            test -s "$f"
          done
          grep -q 'styles.css' index.html
          grep -q 'commands.js' index.html
          grep -q 'app.js' index.html
          grep -q 'site-config.js' index.html
          echo "Website asset references look valid."